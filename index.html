<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Unnathi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400&family=Montserrat:wght@300;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: #0b0704;
      color: #fff;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 30px 20px;
      overflow: hidden;
    }

    /* Primary herd visual: clear mother & baby right in front */
    .elephant-bg {
      position: absolute;
      inset: -2%;
      background-image: url('elephants.jpg');
      background-size: cover;
      background-position: center 25%;
      filter: brightness(0.96) contrast(1.04);
      animation: slowBreath 14s ease-in-out infinite alternate;
      z-index: 1;
    }

    /* Soft top & bottom vignette to keep elephants fully sharp & visible */
    .vignette-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0) 40%, rgba(10, 6, 2, 0.6) 95%);
      z-index: 2;
      pointer-events: none;
    }

    .particles-canvas {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    /* Top Floating Title */
    .top-header {
      position: relative;
      z-index: 10;
      text-align: center;
      background: rgba(20, 14, 8, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 215, 140, 0.3);
      padding: 14px 28px;
      border-radius: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      animation: fadeInDown 1.2s ease-out forwards;
    }

    .top-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 4.5vw, 2.6rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fff9f0;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    /* Bottom Interactive Floating Trigger */
    .bottom-bar {
      position: relative;
      z-index: 10;
      margin-bottom: 10px;
      animation: fadeInUp 1.2s ease-out forwards;
    }

    .action-btn {
      background: linear-gradient(135deg, #dfa84a 0%, #a86426 100%);
      color: #120c06;
      border: 1px solid rgba(255, 235, 185, 0.6);
      padding: 14px 36px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(223, 168, 74, 0.4);
      transition: all 0.3s ease;
    }

    .action-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7), 0 0 25px rgba(223, 168, 74, 0.7);
      background: linear-gradient(135deg, #f0ba5a 0%, #b87333 100%);
    }

    /* Letter / Modal Popup */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 30;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-body {
      background: #18110b;
      border: 1px solid rgba(255, 215, 140, 0.35);
      border-radius: 18px;
      max-width: 480px;
      width: 100%;
      padding: 38px 28px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
      transform: scale(0.92);
      transition: transform 0.35s ease;
    }

    .modal-overlay.active .modal-body {
      transform: scale(1);
    }

    .modal-badge {
      font-size: 0.78rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #f3c26b;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .modal-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      line-height: 1.8;
      color: #fdf5ec;
      margin-bottom: 26px;
    }

    .close-btn {
      background: transparent;
      color: #f3c26b;
      border: 1px solid #f3c26b;
      padding: 8px 26px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: background 0.3s;
    }

    .close-btn:hover {
      background: rgba(243, 194, 107, 0.18);
    }

    @keyframes slowBreath {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.03) translateY(-6px); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="viewport">
    <div class="elephant-bg"></div>
    <div class="vignette-overlay"></div>
    <canvas id="particles" class="particles-canvas"></canvas>

    <div class="top-header">
      <h1>Happy Birthday, Unnathi</h1>
    </div>

    <div class="bottom-bar">
      <button class="action-btn" id="openBtn">Open Letter</button>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-body">
      <div class="modal-badge">To Unnathi</div>
      <p class="modal-text">
        "Like the gentle bond that guides the herd through the vast golden plains, your presence brings warmth, grace, and steady comfort wherever you go. Wishing you a truly wonderful and unforgettable birthday."
      </p>
      <button class="close-btn" id="closeBtn">Close</button>
    </div>
  </div>

  <script>
    // Ambient Savanna Dust/Glow Particles
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.6;
        this.speedY = -(Math.random() * 0.35 + 0.1);
        this.speedX = (Math.random() - 0.5) * 0.25;
        this.alpha = Math.random() * 0.65 + 0.2;
        this.fade = Math.random() * 0.005 + 0.002;
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.alpha += this.fade;
        if (this.alpha > 0.85 || this.alpha < 0.1) this.fade = -this.fade;
        if (this.y < -10 || this.x < 0 || this.x > canvas.width) {
          this.reset();
          this.y = canvas.height + 10;
        }
      }
      draw() {
        ctx.fillStyle = `rgba(255, 215, 130, ${Math.max(0, this.alpha)})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 45; i++) particles.push(new Particle());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();

    // Modal Events
    const openBtn = document.getElementById('openBtn');
    const closeBtn = document.getElementById('closeBtn');
    const modal = document.getElementById('modal');

    openBtn.addEventListener('click', () => modal.classList.add('active'));
    closeBtn.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });
  </script>
</body>
</html>
