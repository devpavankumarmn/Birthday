<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Unnathi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,400&family=Montserrat:wght@300;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background-color: #0d0906;
      color: #fff;
    }

    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      overflow: hidden;
    }

    /* Crisp, fully visible mother & baby elephant image */
    .elephant-bg {
      position: absolute;
      inset: -2% -2% -2% -2%;
      background-image: url('https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?q=80&w=2600&auto=format&fit=crop');
      background-size: cover;
      background-position: center 25%;
      filter: brightness(0.92) contrast(1.05);
      animation: gentleZoom 16s ease-in-out infinite alternate;
      z-index: 1;
    }

    /* Subtle bottom gradient only to keep elephants 100% visible */
    .cinematic-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.05) 0%,
        rgba(0, 0, 0, 0.1) 40%,
        rgba(15, 9, 4, 0.75) 80%,
        rgba(10, 5, 2, 0.95) 100%
      );
      z-index: 2;
    }

    .particles-canvas {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
    }

    /* Docked lower bar so elephants remain the primary focus */
    .content-container {
      position: relative;
      z-index: 10;
      text-align: center;
      width: 92%;
      max-width: 620px;
      margin-bottom: 40px;
      padding: 28px 24px;
      background: rgba(18, 11, 7, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 215, 140, 0.3);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
      animation: slideUp 1.2s ease-out forwards;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 5.5vw, 3.4rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fffaf2;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
      margin-bottom: 6px;
    }

    .subtitle {
      font-style: italic;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.25rem;
      color: #f1dfca;
      margin-bottom: 18px;
      line-height: 1.4;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
    }

    .action-btn {
      background: linear-gradient(135deg, #dfa84a 0%, #b87333 100%);
      color: #120c06;
      border: none;
      padding: 12px 32px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 5px 18px rgba(223, 168, 74, 0.45);
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(223, 168, 74, 0.65);
    }

    /* Modal Message Pop-up */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 30;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-body {
      background: #19110b;
      border: 1px solid rgba(255, 215, 140, 0.35);
      border-radius: 18px;
      max-width: 480px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
      transform: scale(0.92);
      transition: transform 0.35s ease;
    }

    .modal-overlay.active .modal-body {
      transform: scale(1);
    }

    .modal-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem;
      line-height: 1.8;
      color: #f7ede3;
      margin-bottom: 24px;
    }

    .close-btn {
      background: transparent;
      color: #f3c26b;
      border: 1px solid #f3c26b;
      padding: 8px 26px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      transition: background 0.3s;
    }

    .close-btn:hover {
      background: rgba(243, 194, 107, 0.18);
    }

    @keyframes gentleZoom {
      0% { transform: scale(1); }
      100% { transform: scale(1.035); }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="viewport">
    <div class="elephant-bg"></div>
    <div class="cinematic-overlay"></div>
    <canvas id="particles" class="particles-canvas"></canvas>

    <div class="content-container">
      <h1>Happy Birthday, Unnathi</h1>
      <p class="subtitle">Gentle strength, grace, and steady warmth.</p>
      <button class="action-btn" id="openBtn">Open Letter</button>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-body">
      <p class="modal-text">
        "Like the gentle bond that guides the herd through golden open plains, your presence brings comfort, warmth, and grace wherever you go. Wishing you a truly beautiful and joyful birthday."
      </p>
      <button class="close-btn" id="closeBtn">Close</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.6;
        this.speedY = -(Math.random() * 0.35 + 0.1);
        this.speedX = (Math.random() - 0.5) * 0.25;
        this.alpha = Math.random() * 0.6 + 0.2;
        this.fade = Math.random() * 0.005 + 0.002;
      }
      update() {
        this.y += this.speedY;
        this.x += this.speedX;
        this.alpha += this.fade;
        if (this.alpha > 0.8 || this.alpha < 0.1) this.fade = -this.fade;
        if (this.y < -10 || this.x < 0 || this.x > canvas.width) {
          this.reset();
          this.y = canvas.height + 10;
        }
      }
      draw() {
        ctx.fillStyle = `rgba(255, 210, 120, ${Math.max(0, this.alpha)})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (let i = 0; i < 45; i++) particles.push(new Particle());

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animate);
    }
    animate();

    const openBtn = document.getElementById('openBtn');
    const closeBtn = document.getElementById('closeBtn');
    const modal = document.getElementById('modal');

    openBtn.addEventListener('click', () => modal.classList.add('active'));
    closeBtn.addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('active');
    });
  </script>
</body>
</html>
